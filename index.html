<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Ledger — MIT Critical Data</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  :root{
    --mit-red:#A31F34;
    --mit-charcoal:#333333;
    --ink:#1c1c1c;
    --muted:#6b6b6b;
    --line:#e3e1de;
    --bg:#ffffff;
    --panel:#faf9f7;
    --teal:#0f7a7a;
    --teal-bg:#e3f4f4;
    --green:#1e7d3c;
    --green-bg:#e4f5e9;
    --amber:#8a6100;
    --amber-bg:#fbf0d6;
    --orange:#a15c00;
    --orange-bg:#fbe9d6;
    --red:#A31F34;
    --red-bg:#fbe4e8;
    --gray:#595959;
    --gray-bg:#eeece9;
    --focus:#2563eb;
    /* No web-font request — this project deliberately has zero external
       runtime dependencies that could fail mid-demo (same reasoning as
       demo mode replacing the Cloudflare Worker). --font-display and
       --font-mono give headings/badges their own visual weight using only
       fonts already on the device, and are named as separate variables
       so a real Archivo/Inter/IBM Plex Mono system could be dropped in
       later (self-hosted, not a live CDN call) without touching every
       rule that references them. */
    --font-display:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-body:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --font-mono:ui-monospace,SFMono-Regular,Consolas,"Courier New",monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--font-body);
    color:var(--ink);
    background:var(--bg);
    line-height:1.4;
  }
  a{color:var(--mit-red);}
  button{font:inherit;}
  .wrap{max-width:1680px;margin:0 auto;padding:0 20px 64px;}

  header.site{
    border-bottom:3px solid var(--mit-red);
    padding:20px 0;
    margin-bottom:28px;
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  header.site .brand{display:flex;align-items:center;gap:16px;}
  header.site img.logo{height:40px;width:auto;display:block;}
  header.site nav a{font-size:.86rem;font-weight:600;color:var(--mit-red);text-decoration:none;white-space:nowrap;}
  header.site nav a:hover{text-decoration:underline;}
  header.site h1{
    font-family:var(--font-display);
    font-size:1.35rem;
    margin:0;
    color:var(--mit-charcoal);
    font-weight:700;
  }
  header.site p.tagline{
    margin:2px 0 0;
    color:var(--muted);
    font-size:.85rem;
  }

  #error-banner{
    display:none;
    max-width:1100px;
    margin:0 auto 20px;
    padding:14px 18px;
    background:var(--red-bg);
    border:1px solid var(--mit-red);
    color:var(--mit-charcoal);
    border-radius:6px;
    font-size:.92rem;
  }
  #error-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;}

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(128px,1fr));
    gap:10px;
    margin-bottom:26px;
  }
  .kpi-card{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .12s,box-shadow .12s;
  }
  .kpi-card:hover{border-color:var(--mit-red);}
  .kpi-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .kpi-card.active{
    border-color:var(--mit-red);
    box-shadow:0 0 0 1px var(--mit-red);
    background:#fff;
  }
  .kpi-card .num{font-family:var(--font-display);font-size:1.6rem;font-weight:700;color:var(--mit-charcoal);}
  .kpi-card.active .num{color:var(--mit-red);}
  .kpi-card .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

  .controls{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .controls input[type=search]{
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.9rem;
    background:#fff;
    color:var(--ink);
    flex:1 1 260px;
    min-width:200px;
  }
  .controls input[type=search]:focus{outline:2px solid var(--focus);outline-offset:1px;}

  /* -------------------- Three-column layout: filter rail / main / widgets rail -------------------- */
  .dashboard-layout{
    display:grid;
    grid-template-columns:216px minmax(0,1fr) 252px;
    gap:24px;
    align-items:start;
  }
  .main-content{min-width:0;}
  .left-rail,.right-rail{min-width:0;}
  .rail-toggle-btn{
    display:none;
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px 14px;
    font-size:.86rem;
    font-weight:600;
    color:var(--mit-charcoal);
    cursor:pointer;
    margin-bottom:12px;
    text-align:left;
    align-items:center;
    justify-content:space-between;
  }
  .rail-toggle-btn .chevron{transition:transform .15s;}
  .rail-toggle-btn[aria-expanded="true"] .chevron{transform:rotate(180deg);}
  .rail-section{
    border:1px solid var(--line);
    border-radius:10px;
    background:var(--panel);
    padding:16px;
    margin-bottom:16px;
  }
  .rail-section h6{
    margin:0 0 10px;
    font-family:var(--font-display);
    font-size:.72rem;
    font-weight:700;
    color:var(--mit-charcoal);
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .filter-group{margin-bottom:16px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-group-label{
    display:block;
    font-size:.68rem;
    font-weight:700;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:6px;
  }
  .filter-chip{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    width:100%;
    text-align:left;
    background:none;
    border:1px solid transparent;
    border-radius:6px;
    padding:6px 8px;
    font-size:.84rem;
    color:var(--ink);
    cursor:pointer;
    transition:background .12s;
  }
  .filter-chip:hover{background:#fff;}
  .filter-chip.active{background:var(--red-bg);color:var(--mit-red);font-weight:600;border-color:var(--mit-red);}
  .filter-chip .chip-count{font-size:.74rem;color:var(--muted);font-family:var(--font-mono);}
  .filter-chip.active .chip-count{color:var(--mit-red);}
  .filter-chip:disabled{opacity:.4;cursor:default;}
  .filter-chip:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}

  .rail-widget-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;}
  .rail-widget-item{
    display:block;
    width:100%;
    text-align:left;
    background:none;
    border:none;
    border-radius:6px;
    padding:7px 8px;
    cursor:pointer;
    font-size:.82rem;
    color:var(--ink);
  }
  .rail-widget-item:hover{background:#fff;}
  .rail-widget-item .rw-title{display:block;font-weight:600;color:var(--mit-charcoal);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .rail-widget-item .rw-meta{display:block;font-size:.74rem;color:var(--muted);margin-top:1px;}
  .rail-widget-item .rw-meta.overdue{color:var(--mit-red);font-weight:600;}
  .rail-widget-empty{font-size:.82rem;color:var(--muted);font-style:italic;margin:0;}

  @media (max-width:1100px){
    .dashboard-layout{grid-template-columns:1fr;}
    .rail-toggle-btn{display:flex;}
    .left-rail .rail-content{display:none;}
    .left-rail .rail-content.open{display:block;}
    .right-rail{margin-top:20px;}
  }

  #result-count{
    font-size:.82rem;
    color:var(--muted);
    margin-bottom:12px;
  }

  .paper-list{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:16px;
    align-items:start;
  }
  .paper-card{
    /* Grid items default to min-width:auto, which bases the minimum on
       unbreakable content inside (e.g. the nowrap "Open to new members"
       badge) — without this override that blows the track past its
       minmax() width and overflows the viewport on narrow screens. */
    min-width:0;
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    background:#fff;
    box-shadow:0 1px 3px rgba(0,0,0,.05);
  }
  .paper-card.expanded{grid-column:1 / -1;}
  @media (max-width:700px){
    .paper-list{grid-template-columns:1fr;}
  }

  .needs-status-block{
    margin-top:2px;
    grid-column:1 / -1;
    min-width:0;
    border:1px solid var(--line);
    border-radius:12px;
    background:var(--panel);
  }
  .needs-status-block summary{
    cursor:pointer;
    padding:12px 16px;
    font-weight:600;
    font-size:.88rem;
    color:var(--mit-charcoal);
  }
  .needs-status-block summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
  .needs-status-block[open] summary{border-bottom:1px solid var(--line);}
  .needs-status-list{padding:14px;}
  .paper-card .row1{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  .paper-card h3{
    margin:0;
    font-family:var(--font-display);
    font-size:1.02rem;
    font-weight:700;
    color:var(--mit-charcoal);
    max-width:70ch;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 10px;
    border-radius:999px;
    font-family:var(--font-mono);
    font-size:.74rem;
    font-weight:600;
    white-space:nowrap;
  }
  .badge.b-teal{color:var(--teal);background:var(--teal-bg);}
  .badge.b-green{color:var(--green);background:var(--green-bg);}
  .badge.b-amber{color:var(--amber);background:var(--amber-bg);}
  .badge.b-orange{color:var(--orange);background:var(--orange-bg);}
  .badge.b-red{color:var(--red);background:var(--red-bg);}
  .badge.b-gray{color:var(--gray);background:var(--gray-bg);}

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    margin-top:8px;
    font-size:.82rem;
    color:var(--muted);
  }
  .meta-row .meta-item strong{color:var(--ink);font-weight:600;}
  .priority-High{color:var(--mit-red);font-weight:600;}

  .paper-title-btn{
    display:block;
    margin:0;
    padding:0;
    border:none;
    background:none;
    font-family:var(--font-display);
    font-size:1.02rem;
    font-weight:700;
    color:var(--mit-charcoal);
    max-width:70ch;
    min-width:0;
    flex:1 1 auto;
    text-align:left;
    cursor:pointer;
    line-height:1.3;
    white-space:normal;
    overflow-wrap:break-word;
  }
  .paper-title-btn:hover{color:var(--mit-red);text-decoration:underline;}
  .paper-title-btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .card-actions{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:10px;
  }
  .edited-flag{
    font-size:.74rem;
    font-weight:600;
    color:var(--amber);
    background:var(--amber-bg);
    padding:2px 8px;
    border-radius:999px;
  }
  .new-flag{
    font-size:.74rem;
    font-weight:600;
    color:var(--teal);
    background:var(--teal-bg);
    padding:2px 8px;
    border-radius:999px;
  }
  .open-badge{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:.74rem;
    font-weight:600;
    color:var(--green);
    background:var(--green-bg);
    padding:2px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .new-project-btn{
    background:#fff;
    border:1px solid var(--mit-red);
    color:var(--mit-red);
    border-radius:6px;
    padding:9px 16px;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
  }
  .new-project-btn:hover{background:var(--red-bg);}

  .detail-panel{
    display:none;
    margin-top:12px;
    padding:16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
  }
  .detail-panel.open{display:block;}
  .detail-panel h4{
    margin:0 0 10px;
    font-size:.82rem;
    font-weight:700;
    color:var(--mit-charcoal);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .detail-panel p.hint{
    margin:0 0 12px;
    font-size:.82rem;
    color:var(--muted);
  }
  .detail-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:14px;
  }
  .detail-head h3{margin:0;font-family:var(--font-display);font-weight:700;font-size:1.1rem;color:var(--mit-charcoal);}
  .detail-close{
    background:none;
    border:none;
    color:var(--muted);
    font-size:1.3rem;
    line-height:1;
    cursor:pointer;
    padding:2px 6px;
    border-radius:4px;
  }
  .detail-close:hover{background:var(--line);color:var(--ink);}
  .detail-close:focus-visible{outline:2px solid var(--focus);outline-offset:1px;}
  .detail-section{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);}
  .detail-section:first-of-type{margin-top:0;padding-top:0;border-top:none;}
  .detail-section h5{
    margin:0 0 8px;
    font-size:.76rem;
    font-weight:700;
    color:var(--mit-charcoal);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .detail-meta-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:10px 16px;
    font-size:.86rem;
  }
  .detail-meta-grid dt{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;}
  .detail-meta-grid dd{margin:2px 0 0;color:var(--ink);}
  .detail-empty{color:var(--muted);font-size:.86rem;font-style:italic;}
  .pill-row{display:flex;flex-wrap:wrap;gap:6px;}
  .pill{
    font-size:.76rem;
    padding:3px 10px;
    border-radius:999px;
    background:var(--panel);
    color:var(--muted);
    border:1px solid var(--line);
  }
  .resource-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;}
  .resource-list li a{font-size:.88rem;}
  .team-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:.88rem;color:var(--ink);}
  .team-list li a{font-size:.86rem;}
  .meeting-block{font-size:.86rem;}
  .meeting-block + .meeting-block{margin-top:10px;padding-top:10px;border-top:1px solid var(--line);}
  .meeting-block .m-date{font-weight:600;color:var(--mit-charcoal);}
  .meeting-block .m-notes{color:var(--muted);margin-top:2px;font-style:italic;}
  .detail-edit-toggle{
    margin-top:16px;
    background:var(--mit-red);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
  }
  .detail-edit-toggle:hover{background:#8a1a2b;}
  .edit-field{margin-bottom:10px;}
  .edit-field label{
    display:block;
    font-size:.78rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:4px;
  }
  .edit-field .field-hint{
    display:block;
    font-size:.74rem;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .edit-field input[type=text],
  .edit-field input[type=date],
  .edit-field input[type=email],
  .edit-field select,
  .edit-field textarea{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.88rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .edit-field textarea{resize:vertical;min-height:56px;}
  .edit-field input:focus,
  .edit-field select:focus,
  .edit-field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
  .edit-field input[type=date],
  .edit-field input[type=datetime-local]{color-scheme:light;}
  .edit-field input[type=date]::-webkit-calendar-picker-indicator,
  .edit-field input[type=datetime-local]::-webkit-calendar-picker-indicator{
    cursor:pointer;
    opacity:.55;
    border-radius:4px;
    padding:2px;
  }
  .edit-field input[type=date]:hover::-webkit-calendar-picker-indicator,
  .edit-field input[type=datetime-local]:hover::-webkit-calendar-picker-indicator{
    opacity:1;
    background:var(--red-bg);
  }
  .edit-fieldset{
    border:none;
    padding:10px 0 0;
    margin:12px 0 0;
    border-top:1px dashed var(--line);
  }
  .edit-fieldset legend{
    font-size:.78rem;
    font-weight:700;
    color:var(--mit-charcoal);
    padding:0;
    margin-bottom:6px;
  }
  .edit-row2{display:flex;gap:10px;}
  .edit-row2 > .edit-field{flex:1;}
  .edit-actions{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .edit-btn-primary{
    background:var(--mit-red);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
  }
  .edit-btn-primary:hover{background:#8a1a2b;}
  .edit-btn-primary:disabled{background:var(--gray);cursor:not-allowed;}
  .edit-btn-secondary{
    background:none;
    border:none;
    color:var(--muted);
    font-size:.82rem;
    cursor:pointer;
    text-decoration:underline;
  }
  .edit-message{
    font-size:.82rem;
    padding:8px 12px;
    border-radius:6px;
    margin-bottom:12px;
  }
  .edit-message.info{background:var(--teal-bg);color:var(--teal);}
  .edit-message.error{background:var(--red-bg);color:var(--mit-red);}
  .edit-message.success{background:var(--green-bg);color:var(--green);}

  .resource-edit-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .resource-edit-row input{flex:1;}
  .resource-edit-row input:first-child{flex:0 0 34%;}
  .resource-remove-btn{
    flex:0 0 auto;
    background:none;
    border:1px solid var(--line);
    border-radius:6px;
    color:var(--muted);
    font-size:1rem;
    line-height:1;
    padding:6px 10px;
    cursor:pointer;
  }
  .resource-remove-btn:hover{color:var(--mit-red);border-color:var(--mit-red);}
  .add-resource-btn{
    background:none;
    border:1px dashed var(--line);
    border-radius:6px;
    color:var(--mit-red);
    font-size:.82rem;
    font-weight:600;
    padding:7px 12px;
    cursor:pointer;
  }
  .add-resource-btn:hover{border-color:var(--mit-red);}

  .timeline{
    display:none;
    margin-top:12px;
    padding-left:0;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }
  .timeline.open{display:block;}
  .timeline ol{list-style:none;margin:0;padding:0;}
  .timeline li{
    position:relative;
    padding:0 0 14px 20px;
    border-left:2px solid var(--line);
  }
  .timeline li:last-child{border-left-color:transparent;padding-bottom:0;}
  .timeline li::before{
    content:"";
    position:absolute;
    left:-6px;top:2px;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--mit-red);
    border:2px solid #fff;
  }
  .timeline .t-venue{font-weight:600;color:var(--mit-charcoal);font-size:.88rem;}
  .timeline .t-meta{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .timeline .t-notes{font-size:.78rem;color:var(--muted);margin-top:3px;font-style:italic;}

  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--muted);
  }

  #demo-banner{
    position:sticky;
    top:0;
    z-index:50;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    background:var(--amber-bg);
    color:var(--amber);
    border-bottom:1px solid var(--amber);
    padding:5px 14px;
    font-size:.76rem;
    font-weight:600;
    text-align:center;
  }
  #demo-banner.dismissed{display:none;}
  #demo-banner .demo-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
  #demo-banner button{
    background:none;
    border:none;
    color:var(--amber);
    border-radius:4px;
    padding:2px 7px;
    font-size:.72rem;
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    text-decoration:underline;
  }
  #demo-banner button:hover{background:var(--amber);color:#fff;text-decoration:none;}
  #dismiss-demo-btn{
    text-decoration:none;
    font-size:.9rem;
    line-height:1;
    padding:1px 6px;
  }

  .modal-overlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:200;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .modal-overlay.open{display:flex;}
  .modal-box{
    background:#fff;
    border-radius:10px;
    padding:20px;
    max-width:560px;
    width:100%;
    max-height:80vh;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .modal-box.wide{max-width:640px;max-height:88vh;}
  .modal-box.wide form,
  .modal-box.wide .modal-scroll{overflow-y:auto;padding-right:4px;}
  .modal-box h4{margin:0;font-size:1rem;color:var(--mit-charcoal);}
  .modal-box textarea{
    flex:1;
    min-height:200px;
    font-family:ui-monospace,Consolas,monospace;
    font-size:.78rem;
    padding:10px;
    border:1px solid var(--line);
    border-radius:6px;
    resize:vertical;
  }
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;}

  .danger-zone{
    margin-top:18px;
    padding-top:14px;
    border-top:1px dashed var(--line);
  }
  .delete-link{
    background:none;
    border:none;
    color:var(--mit-red);
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
    text-decoration:underline;
  }
  .delete-confirm{
    background:var(--red-bg);
    border:1px solid var(--mit-red);
    border-radius:8px;
    padding:14px 16px;
  }
  .delete-confirm p{margin:0 0 12px;font-size:.88rem;color:var(--mit-charcoal);}
  .edit-btn-danger{
    background:var(--mit-red);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
  }
  .edit-btn-danger:hover{background:#8a1a2b;}
  .checkbox-field{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .checkbox-field input{width:18px;height:18px;accent-color:var(--mit-red);cursor:pointer;flex:0 0 auto;}
  .checkbox-field label{margin:0;font-size:.84rem;font-weight:600;color:var(--ink);cursor:pointer;}

  /* -------------------- Motion -------------------- */
  @keyframes fadeSlideIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
  @keyframes overlayFadeIn{from{opacity:0;}to{opacity:1;}}
  @keyframes modalPopIn{from{opacity:0;transform:scale(.96);}to{opacity:1;transform:scale(1);}}
  @keyframes cardFadeIn{from{opacity:0;transform:translateY(2px);}to{opacity:1;transform:translateY(0);}}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  @keyframes shimmer{0%{background-position:-200px 0;}100%{background-position:calc(200px + 100%) 0;}}

  .detail-panel.open{animation:fadeSlideIn .16s ease;}
  .modal-overlay.open{animation:overlayFadeIn .14s ease;}
  .modal-overlay.open .modal-box{animation:modalPopIn .18s ease;}
  .paper-card{animation:cardFadeIn .14s ease;transition:box-shadow .15s,border-color .15s,transform .15s;}
  .paper-card:hover{border-color:#cfcbc5;box-shadow:0 6px 16px rgba(0,0,0,.08);transform:translateY(-2px);}
  .paper-card.expanded:hover{transform:none;}
  .kpi-card{transition:border-color .12s,box-shadow .12s,transform .1s;}
  .kpi-card:active{transform:scale(.97);}
  .project-card{animation:cardFadeIn .14s ease;}

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
      scroll-behavior:auto !important;
    }
  }

  /* -------------------- Toasts -------------------- */
  #toast-container{
    position:fixed;
    bottom:20px;
    right:20px;
    z-index:300;
    display:flex;
    flex-direction:column-reverse;
    gap:8px;
    max-width:320px;
  }
  .toast{
    background:var(--mit-charcoal);
    color:#fff;
    padding:10px 16px;
    border-radius:8px;
    font-size:.86rem;
    font-weight:600;
    box-shadow:0 4px 14px rgba(0,0,0,.18);
    animation:toastIn .18s ease;
  }
  .toast.success{background:var(--green);}
  .toast.error{background:var(--mit-red);}
  @media (max-width:520px){
    #toast-container{left:12px;right:12px;bottom:12px;max-width:none;}
  }

  /* -------------------- Loading skeleton -------------------- */
  .skel{
    background:linear-gradient(90deg,var(--panel) 25%,#f1efec 37%,var(--panel) 63%);
    background-size:400px 100%;
    animation:shimmer 1.3s ease-in-out infinite;
    border-radius:6px;
  }
  .skel-kpi{height:58px;border:1px solid var(--line);border-radius:8px;}
  .skel-card{height:78px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;}

  .empty-state .empty-icon{font-size:1.8rem;display:block;margin-bottom:8px;}
  .empty-state p{margin:4px 0 0;font-size:.85rem;}

  footer.site{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:.78rem;
    color:var(--muted);
  }

  @media (max-width:820px){
    .kpi-row{grid-template-columns:repeat(4,1fr);}
  }
  @media (max-width:520px){
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px;}
    .kpi-card{padding:10px 12px;}
    header.site img.logo{height:32px;}
    header.site h1{font-size:1.1rem;}
    .paper-card{padding:10px 14px;}
    .paper-card h3,
    .paper-title-btn{max-width:100%;}
    .controls .new-project-btn{flex:1 1 100%;}
    #demo-banner{font-size:.72rem;padding:5px 10px;text-align:left;justify-content:flex-start;}
    .detail-meta-grid{grid-template-columns:1fr 1fr;}
    .edit-row2{flex-direction:column;gap:0;}
    .resource-edit-row{flex-wrap:wrap;}
    .resource-edit-row input:first-child{flex:1 1 100%;}
    .modal-box.wide{max-width:100%;max-height:92vh;}
  }

  @media print{
    *{
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      color-adjust:exact;
    }
    body{font-size:11pt;}
    .paper-title-btn{color:inherit;cursor:default;}
    header.site nav,
    .controls,
    #result-count,
    #demo-banner,
    .detail-panel,
    .detail-edit-toggle,
    .modal-overlay,
    .empty-state{display:none !important;}
    header.site{margin-bottom:16px;padding:10px 0;}
    .kpi-row{margin-bottom:16px;}
    .kpi-card{break-inside:avoid;box-shadow:none;}
    .kpi-card:hover{border-color:var(--line);}
    .paper-list{gap:6px;}
    .paper-card{
      break-inside:avoid;
      page-break-inside:avoid;
      padding:10px 14px;
    }
    .needs-status-block{break-inside:auto;border:none;background:none;}
    .needs-status-block summary{
      padding:8px 0;
      border-bottom:1px solid var(--line);
      margin-bottom:8px;
    }
    a{color:inherit;text-decoration:none;}
  }
</style>
</head>
<body>

<div id="demo-banner" role="status">
  <span>🎭 Demo mode <span title="Edits, new projects, and deletions are saved in this browser only, not yet shared with the team. A new project marked &quot;Open to new members&quot; will also show up on the Discover page, flagged as a demo addition — but only in this same browser. Deleting a real paper here never removes it from Discover either way, since that page never reads this browser's edits. None of this is visible to any other visitor until it goes through the real spreadsheet.">ⓘ</span></span>
  <div class="demo-actions">
    <button type="button" id="reset-demo-btn">Reset</button>
    <button type="button" id="copy-demo-btn">Copy JSON</button>
    <button type="button" id="dismiss-demo-btn" aria-label="Dismiss demo mode banner for this session">×</button>
  </div>
</div>

<header class="site">
  <div class="wrap">
    <div class="brand">
      <img class="logo" src="assets/mit-critical-data-logo.svg" alt="MIT Critical Data">
      <div>
        <h1>Lab Ledger</h1>
        <p class="tagline">Every paper, what stage it's at, and its full submission history.</p>
      </div>
    </div>
    <nav><a href="discover.html">Browse open projects →</a></nav>
  </div>
</header>

<div id="error-banner" role="alert"></div>

<div class="modal-overlay" id="copy-json-overlay">
  <div class="modal-box">
    <h4 id="copy-json-title">Your demo changes</h4>
    <textarea id="copy-json-text" readonly></textarea>
    <div class="modal-actions">
      <button type="button" class="edit-btn-secondary" id="copy-json-close">Close</button>
      <button type="button" class="edit-btn-primary" id="copy-json-copy">Copy to clipboard</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="new-project-overlay">
  <div class="modal-box wide">
    <h4>New project</h4>
    <div class="modal-scroll" id="new-project-form-slot"></div>
  </div>
</div>

<div class="modal-overlay" id="confirm-overlay">
  <div class="modal-box">
    <h4 id="confirm-title">Are you sure?</h4>
    <p id="confirm-message" style="margin:0;font-size:.9rem;color:var(--ink)"></p>
    <div class="modal-actions">
      <button type="button" class="edit-btn-secondary" id="confirm-cancel">Cancel</button>
      <button type="button" class="edit-btn-danger" id="confirm-ok">Continue</button>
    </div>
  </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<main class="wrap">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="controls">
    <input type="search" id="search-input" placeholder="Search by title, owner, venue, or notes…" aria-label="Search papers">
    <button type="button" class="new-project-btn" id="new-project-btn">+ New Project</button>
  </div>

  <div class="dashboard-layout">
    <aside class="left-rail">
      <button type="button" class="rail-toggle-btn" id="filters-toggle" aria-expanded="false">
        <span>☰ Filters</span><span class="chevron">▾</span>
      </button>
      <div class="rail-content" id="filters-rail-content">
        <div class="rail-section" id="filters-rail"></div>
      </div>
    </aside>

    <div class="main-content">
      <div id="result-count"></div>
      <div class="paper-list" id="paper-list"></div>
    </div>

    <aside class="right-rail" id="right-rail"></aside>
  </div>
</main>

<div class="wrap"><footer class="site">Lab Ledger — MIT Critical Data. Data regenerated from <code>Lab_Papers_Dashboard.xlsx</code> via <code>export_data.py</code>.</footer></div>

<script>
(function(){
  "use strict";

  var state = {
    rawPapers: [],   // exactly what data.json/data.sample.json contained, never mutated
    papers: [],      // rawPapers with this session's demo edits merged on top — everything renders from this
    activeKpi: null,
    search: "",
    needsStatusOpen: false,
    openDetailPaperId: null,
    loading: true,
    // Left-rail facet filters — combine with search + the KPI strip via AND,
    // same as the KPI strip already combines with search. Each is
    // single-select-with-toggle-off, same interaction as a KPI card.
    filterStage: null,
    filterStatus: null,
    filterOpenOnly: false
  };

  var KPI_DEFS = [
    { key: "total",        label: "Total Papers",          test: function(){ return true; } },
    { key: "preSub",       label: "Pre-Submission",         test: function(p){ return p.attempts === 0; } },
    { key: "outForReview", label: "Currently Out for Review", test: function(p){ return p.attempts > 0 && !isAcceptedOrPublished(p); } },
    { key: "accepted",     label: "Accepted / Published",   test: isAcceptedOrPublished },
    { key: "overdue",      label: "Overdue",                test: function(p){ return statusHas(p, "Overdue"); } },
    { key: "needsStatus",  label: "Needs Status",           test: function(p){ return statusHas(p, "Needs Status"); } },
    { key: "openToNew",    label: "Open to New Members",    test: function(p){ return !!p.openToNewMembers; } }
  ];

  function statusHas(p, needle){
    return !!(p.status && p.status.indexOf(needle) !== -1);
  }
  function isAcceptedOrPublished(p){
    return statusHas(p, "Completed") || statusHas(p, "Published");
  }

  function badgeClass(status){
    if (!status) return "b-gray";
    if (status.indexOf("Overdue") !== -1 || status.indexOf("Closed") !== -1) return "b-red";
    if (status.indexOf("Needs Attention") !== -1) return "b-amber";
    if (status.indexOf("Waiting") !== -1) return "b-orange";
    if (status.indexOf("Reviewing") !== -1) return "b-teal";
    if (status.indexOf("On Track") !== -1) return "b-green";
    if (status.indexOf("Completed") !== -1 || status.indexOf("Published") !== -1) return "b-green";
    return "b-gray";
  }

  function fmtDate(iso){
    if (!iso) return null;
    var d = new Date(iso + (iso.length <= 10 ? "T00:00:00" : ""));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showError(message){
    var el = document.getElementById("error-banner");
    el.textContent = message;
    el.style.display = "block";
  }

  // -------------------- Toasts & confirm modal --------------------
  // Small, dependency-free replacements for native alert()/confirm() so
  // every user-facing dialog in the app shares one visual language instead
  // of breaking out into the browser's own unstyled prompt.

  function showToast(message, type){
    var container = document.getElementById("toast-container");
    var el = document.createElement("div");
    el.className = "toast" + (type ? " " + type : "");
    el.textContent = message;
    container.appendChild(el);
    setTimeout(function(){
      el.style.transition = "opacity .2s ease";
      el.style.opacity = "0";
      setTimeout(function(){ el.remove(); }, 220);
    }, 3200);
  }

  function showConfirmModal(opts, onConfirm){
    var overlay = document.getElementById("confirm-overlay");
    document.getElementById("confirm-title").textContent = opts.title || "Are you sure?";
    document.getElementById("confirm-message").textContent = opts.message || "";
    var okBtn = document.getElementById("confirm-ok");
    var cancelBtn = document.getElementById("confirm-cancel");
    okBtn.textContent = opts.confirmLabel || "Continue";
    overlay.classList.add("open");

    function cleanup(){
      overlay.classList.remove("open");
      okBtn.removeEventListener("click", onOk);
      cancelBtn.removeEventListener("click", onCancel);
    }
    function onOk(){ cleanup(); onConfirm(); }
    function onCancel(){ cleanup(); }
    okBtn.addEventListener("click", onOk);
    cancelBtn.addEventListener("click", onCancel);
  }

  function renderKpiSkeleton(){
    var row = document.getElementById("kpi-row");
    row.innerHTML = "";
    for (var i = 0; i < 6; i++) {
      var div = document.createElement("div");
      div.className = "skel skel-kpi";
      row.appendChild(div);
    }
  }

  function renderListSkeleton(){
    var list = document.getElementById("paper-list");
    list.innerHTML = "";
    for (var i = 0; i < 5; i++) {
      var div = document.createElement("div");
      div.className = "skel skel-card";
      list.appendChild(div);
    }
  }

  function renderKpis(){
    var row = document.getElementById("kpi-row");
    row.innerHTML = "";
    KPI_DEFS.forEach(function(def){
      var count = state.papers.filter(def.test).length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "kpi-card" + (state.activeKpi === def.key ? " active" : "");
      btn.setAttribute("aria-pressed", state.activeKpi === def.key ? "true" : "false");
      btn.innerHTML = '<div class="num">' + count + '</div><div class="label">' + escapeHtml(def.label) + '</div>';
      btn.addEventListener("click", function(){
        state.activeKpi = (state.activeKpi === def.key) ? null : def.key;
        render();
      });
      row.appendChild(btn);
    });
  }

  function matchesSearch(p, q){
    if (!q) return true;
    var haystack = [p.title, p.authors, p.owner, p.currentVenue, p.targetVenue, p.notes]
      .filter(Boolean).join(" ").toLowerCase();
    return haystack.indexOf(q) !== -1;
  }

  // Every active filter — the KPI strip, the search box, and the three
  // left-rail facets — combines via AND. `skip` lets a facet's own rail
  // count be computed against every OTHER active filter without counting
  // itself out, i.e. standard faceted-search "how many would this ADD"
  // counts, not "how many total".
  function matchesFilters(p, skip){
    skip = skip || {};
    var q = state.search.trim().toLowerCase();
    if (!skip.kpi) {
      var kpiDef = KPI_DEFS.find(function(d){ return d.key === state.activeKpi; });
      if (kpiDef && !kpiDef.test(p)) return false;
    }
    if (!skip.search && !matchesSearch(p, q)) return false;
    if (!skip.stage && state.filterStage && p.stage !== state.filterStage) return false;
    if (!skip.status && state.filterStatus && p.status !== state.filterStatus) return false;
    if (!skip.open && state.filterOpenOnly && !p.openToNewMembers) return false;
    return true;
  }

  function filteredPapers(){
    return state.papers.filter(function(p){ return matchesFilters(p, {}); });
  }

  function renderTimelineContent(p){
    if (!p.submissions || p.submissions.length === 0) return "";
    var items = p.submissions.map(function(s){
      var venue = escapeHtml(s.venue || "Unknown venue");
      var parts = [];
      if (s.submittedDate) parts.push("Submitted " + fmtDate(s.submittedDate));
      if (s.decision) parts.push(escapeHtml(s.decision) + (s.decisionDate ? " " + fmtDate(s.decisionDate) : ""));
      var notes = s.notes ? '<div class="t-notes">' + escapeHtml(s.notes) + '</div>' : "";
      return '<li><div class="t-venue">Attempt ' + (s.attempt != null ? s.attempt : "?") + " — " + venue + '</div>' +
             '<div class="t-meta">' + parts.join(" · ") + '</div>' + notes + '</li>';
    }).join("");
    return '<div class="timeline"><ol>' + items + '</ol></div>';
  }

  // ---------------------------------------------------------------------
  // DEMO MODE — everything below persists to localStorage only, never to
  // the shared repo. This deliberately replaces the Cloudflare Worker /
  // email-verification pipeline (parked in worker-phase2-paused/ — see its
  // README) for today's zero-external-dependency demo. See README.md's
  // "Future: real authentication" section for the real plan.
  // ---------------------------------------------------------------------

  var DEMO_EDITS_KEY = "labledger_demo_edits";
  var DEMO_ADDED_KEY = "labledger_demo_added";
  var DEMO_DELETED_KEY = "labledger_demo_deleted";
  var DEMO_NAME_KEY = "labledger_demo_name";
  var DEMO_BANNER_DISMISSED_KEY = "labledger_demo_banner_dismissed";
  var WAITING_STAGES = ["Idea", "On Hold", "Withdrawn"];

  // Ported from scripts/status_logic.py (also ported, separately, to
  // worker-phase2-paused/worker/src/status_logic.js). Three copies because
  // this needs to run in three different runtimes (Excel-reading Python,
  // a paused Worker, and here in the plain browser) with no shared module
  // system between them — keep all three in sync if the rules ever change.
  function daysLeftFromDeadline(deadlineIso, now){
    if (!deadlineIso) return null;
    now = now || new Date();
    var todayUtc = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
    var d = new Date(deadlineIso.slice(0, 10) + "T00:00:00Z");
    var deadlineUtc = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate());
    return Math.round((deadlineUtc - todayUtc) / 86400000);
  }

  function deriveStatus(stage, attempts, latestDecision, deadlineIso, publishedDate, now){
    if (publishedDate) return "⚪ Published";
    if (latestDecision === "Accepted") return "⚪ Completed";
    if (latestDecision === "Rejected") return "🔴 Closed — resubmit?";

    var dleft = daysLeftFromDeadline(deadlineIso, now);

    if (latestDecision === "Revise & Resubmit" || (dleft !== null && dleft >= 0 && dleft <= 14)) {
      return "🟡 Needs Attention";
    }
    if (dleft !== null && dleft < 0) return "🔴 Overdue";
    if (WAITING_STAGES.indexOf(stage) !== -1) return "🟠 Waiting";
    if ((attempts || 0) > 0 || stage === "Internal Review") return "🔵 Reviewing";
    if (stage === "Drafting") return "🟢 On Track";
    return "⚪ Needs Status";
  }

  function fmtDateTime(iso){
    if (!iso) return null;
    var hasTime = iso.length > 10;
    var d = new Date(hasTime ? iso : iso + "T00:00:00");
    if (isNaN(d.getTime())) return iso;
    var opts = { year: "numeric", month: "short", day: "numeric" };
    if (hasTime) { opts.hour = "numeric"; opts.minute = "2-digit"; }
    return d.toLocaleString(undefined, opts);
  }

  function loadJSON(key, fallback){
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : fallback;
    } catch (e) {
      return fallback;
    }
  }

  function saveJSON(key, value){
    try {
      localStorage.setItem(key, JSON.stringify(value));
    } catch (e) {
      console.error("Lab Ledger: couldn't save demo state (localStorage unavailable?)", e);
    }
  }

  function loadDemoEdits(){ return loadJSON(DEMO_EDITS_KEY, {}); }
  function saveDemoEdits(edits){ saveJSON(DEMO_EDITS_KEY, edits); }
  function loadDemoAdded(){ return loadJSON(DEMO_ADDED_KEY, []); }
  function saveDemoAdded(added){ saveJSON(DEMO_ADDED_KEY, added); }
  function loadDemoDeleted(){ return loadJSON(DEMO_DELETED_KEY, []); }
  function saveDemoDeleted(deleted){ saveJSON(DEMO_DELETED_KEY, deleted); }

  function getDemoName(){
    try { return sessionStorage.getItem(DEMO_NAME_KEY) || ""; } catch (e) { return ""; }
  }

  function setDemoName(name){
    try { sessionStorage.setItem(DEMO_NAME_KEY, name); } catch (e) { /* non-fatal */ }
  }

  // Builds the rendered paper list from three localStorage layers on top
  // of the real, unmutated data:
  //   - edits:   { paperId: { fields, editedBy, editedAt } } — the FULL
  //               latest value for every field the demo has touched,
  //               applies to both real and locally-added papers.
  //   - added:   [ fullPaperObject, ... ] — brand-new papers created in
  //               this demo session, never present in data.json.
  //   - deleted: [ paperId, ... ] — a tombstone list. For a real paper this
  //               is the ONLY way demo mode can "delete" it (data.json is
  //               never touched); for a paper that was itself added in
  //               this session, deleting it just removes it from `added`
  //               instead (see commitDemoDelete) — nothing needs a
  //               tombstone if it never existed outside localStorage.
  function buildMergedPapers(rawPapers){
    var edits = loadDemoEdits();
    var added = loadDemoAdded();
    var deletedSet = new Set(loadDemoDeleted());

    function withEdits(p, isAdded){
      var patch = edits[p.id];
      var merged = patch ? Object.assign({}, p, patch.fields || {}) : Object.assign({}, p);
      if (isAdded) merged._demoAdded = true;
      if (patch) {
        merged._demoEdited = true;
        merged._demoEditedBy = patch.editedBy;
        merged._demoEditedAt = patch.editedAt;
      }
      return merged;
    }

    var fromReal = rawPapers.filter(function(p){ return !deletedSet.has(p.id); }).map(function(p){ return withEdits(p, false); });
    var fromAdded = added.filter(function(p){ return !deletedSet.has(p.id); }).map(function(p){ return withEdits(p, true); });
    return fromReal.concat(fromAdded);
  }

  function commitDemoEdit(paperId, updatedFields, editorName){
    var edits = loadDemoEdits();
    var existing = edits[paperId] || { fields: {} };
    edits[paperId] = {
      fields: Object.assign({}, existing.fields, updatedFields),
      editedBy: editorName,
      editedAt: new Date().toISOString()
    };
    saveDemoEdits(edits);
    return edits;
  }

  function nextPaperId(){
    var maxNum = 0;
    state.papers.forEach(function(p){
      var m = /^P(\d+)$/.exec(p.id || "");
      if (m) maxNum = Math.max(maxNum, parseInt(m[1], 10));
    });
    return "P" + String(maxNum + 1).padStart(3, "0");
  }

  function commitDemoAdd(paper, editorName){
    paper._demoCreatedBy = editorName;
    paper._demoCreatedAt = new Date().toISOString();
    var added = loadDemoAdded();
    added.push(paper);
    saveDemoAdded(added);
  }

  // A locally-added paper never existed outside this browser, so deleting
  // it just removes it from `added` — no tombstone needed. A real paper
  // (from data.json) can't be removed from that file, so its id goes on
  // the `deleted` list instead, which filters it out of every render.
  function commitDemoDelete(paperId){
    var added = loadDemoAdded();
    var wasLocallyAdded = added.some(function(p){ return p.id === paperId; });
    if (wasLocallyAdded) {
      saveDemoAdded(added.filter(function(p){ return p.id !== paperId; }));
      var edits = loadDemoEdits();
      if (edits[paperId]) { delete edits[paperId]; saveDemoEdits(edits); }
    } else {
      var deleted = loadDemoDeleted();
      if (deleted.indexOf(paperId) === -1) {
        deleted.push(paperId);
        saveDemoDeleted(deleted);
      }
    }
  }

  function refreshFromDemoEdits(){
    state.papers = buildMergedPapers(state.rawPapers);
    render();
  }

      var name = panel.querySelector("#" + uid + "-name").value.trim();

      var fields = {};

      if (v.targetDeadline) setIfChanged("targetDeadline", v.targetDeadline);
      setIfChanged("abstract", v.abstract || null);
      setIfChanged("tags", v.tags);
      setIfChanged("skillsNeeded", v.skillsNeeded);
      setIfChanged("openToNewMembers", v.openToNewMembers);
      setIfChanged("whatsapp", v.whatsapp || null);
      if (v.meetDate || v.meetLink) setIfChanged("nextMeeting", { date: v.meetDate || null, link: v.meetLink || null });
      setIfChanged("currentDraftLink", v.draftLink || null);
      setIfChanged("resources", v.resources);
      setIfChanged("teamMembers", v.teamMembers);

      var submissions = (p.submissions || []).slice();
      var submissionTouched = false;
      if (venue) {
        var nextAttempt = (p.attempts || 0) + 1;
        submissions.push({
          attempt: nextAttempt, venue: venue, submittedDate: submittedDate, responseDeadline: null,
          decision: decision || null, decisionDate: decisionDate || null, notes: notes || null
        });
        fields.attempts = nextAttempt;
        fields.currentVenue = venue;
        fields.latestDecision = decision || null;
        submissionTouched = true;
      } else if (decision) {
        if (submissions.length > 0) {
          var latest = Object.assign({}, submissions[submissions.length - 1]);
          latest.decision = decision;
          if (decisionDate) latest.decisionDate = decisionDate;
          if (notes) latest.notes = notes;
          submissions[submissions.length - 1] = latest;
          fields.latestDecision = decision;
          submissionTouched = true;
        } else {
          showEditMessage(msgSlot, "error", "No existing submission to apply a decision to — fill in Venue to log a new one instead.");
          return;
        }
      } else if (notes) {
        setIfChanged("notes", notes);
      }
      if (submissionTouched) fields.submissions = submissions;

      if (Object.keys(fields).length === 0) {
        showEditMessage(msgSlot, "error", "Nothing to save — change at least one field.");
        return;
      }

      var now = new Date();
      var newStage = "stage" in fields ? fields.stage : p.stage;
      var newAttempts = "attempts" in fields ? fields.attempts : p.attempts;
      var newDecision = "latestDecision" in fields ? fields.latestDecision : p.latestDecision;
      var newDeadline = "deadline" in fields ? fields.deadline : p.deadline;
      var newStatus = deriveStatus(newStage, newAttempts, newDecision, newDeadline, p.publishedDate, now);
      if (newStatus !== p.status) fields.status = newStatus;
      fields.lastUpdated = now.toISOString().slice(0, 10);

      commitDemoEdit(p.id, fields, name);

      var summaryParts = Object.keys(fields).filter(function(k){ return k !== "submissions"; }).map(function(k){ return k; });
      panel.innerHTML = '<div class="edit-message success">Saved — ' + escapeHtml(summaryParts.join(", ")) + '</div>';
      state.openDetailPaperId = p.id;
      showToast("Changes saved to this browser.", "success");
      setTimeout(refreshFromDemoEdits, 900);
    });
  }

  function renderDetailPanel(panel, p){
    renderDetailReadView(panel, p);
  }

  function renderPaperCard(p){
    var badge = '<span class="badge ' + badgeClass(p.status) + '">' + escapeHtml(p.status || "Unknown") + '</span>';
    var meta = [];
    if (p.owner) meta.push('<span class="meta-item"><strong>Owner:</strong> ' + escapeHtml(p.owner) + '</span>');
    if (p.currentVenue) meta.push('<span class="meta-item"><strong>Venue:</strong> ' + escapeHtml(p.currentVenue) + '</span>');
    else if (p.targetVenue) meta.push('<span class="meta-item"><strong>Target venue:</strong> ' + escapeHtml(p.targetVenue) + '</span>');
    if (p.stage) meta.push('<span class="meta-item"><strong>Stage:</strong> ' + escapeHtml(p.stage) + '</span>');
    if (p.priority) meta.push('<span class="meta-item priority-' + escapeHtml(p.priority) + '"><strong>Priority:</strong> ' + escapeHtml(p.priority) + '</span>');
    if (p.deadline) {
      var dl = "Deadline " + fmtDate(p.deadline);
      if (typeof p.daysLeft === "number") {
        dl += p.daysLeft < 0 ? " (" + Math.abs(p.daysLeft) + " days overdue)" : " (" + p.daysLeft + " days left)";
      }
      meta.push('<span class="meta-item">' + dl + '</span>');
    }
    if (p.lastUpdated) meta.push('<span class="meta-item">Last updated ' + fmtDate(p.lastUpdated) + '</span>');

    var editedFlag = p._demoAdded
      ? '<span class="new-flag">New (not yet shared)</span>'
      : (p._demoEdited ? '<span class="edited-flag">Edited (demo)</span>' : '');
    var openBadge = p.openToNewMembers ? '<span class="open-badge">🤝 Open to new members</span>' : '';

    var el = document.createElement("div");
    el.className = "paper-card";
    el.dataset.paperId = p.id;
    el.innerHTML =
      '<div class="row1"><button type="button" class="paper-title-btn" data-open-detail>' + escapeHtml(p.title) + '</button>' + badge + openBadge + editedFlag + '</div>' +
      '<div class="meta-row">' + meta.join("") + '</div>' +
      '<div class="detail-panel" data-detail-panel></div>';

    var detailPanel = el.querySelector("[data-detail-panel]");
    var titleBtn = el.querySelector("[data-open-detail]");

    function openDetail(){
      state.openDetailPaperId = p.id;
      titleBtn.setAttribute("aria-expanded", "true");
      renderDetailPanel(detailPanel, p);
      detailPanel.classList.add("open");
      el.classList.add("expanded");
    }

    titleBtn.setAttribute("aria-expanded", "false");
    titleBtn.addEventListener("click", function(){
      if (detailPanel.classList.contains("open")) {
        closeDetailPanel(detailPanel);
        titleBtn.setAttribute("aria-expanded", "false");
      } else {
        openDetail();
      }
    });

    // Preserve which paper's detail panel was open across a full re-render
    // (e.g. right after saving an edit), so the presenter doesn't have to
    // reopen it to see the change land.
    if (state.openDetailPaperId === p.id) {
      openDetail();
    }

    return el;
  }

  function renderList(){
    var list = document.getElementById("paper-list");
    var count = document.getElementById("result-count");

    if (state.papers.length === 0) {
      count.textContent = "0 papers";
      list.innerHTML = "";
      var none = document.createElement("div");
      none.className = "empty-state";
      none.innerHTML = '<span class="empty-icon">📭</span>No papers yet.<p>Once the spreadsheet has papers in it, they\'ll show up here.</p>';
      list.appendChild(none);
      return;
    }

    var papers = filteredPapers();
    count.textContent = papers.length + " of " + state.papers.length + " papers";
    list.innerHTML = "";
    if (papers.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.innerHTML = '<span class="empty-icon">🔍</span>No papers match the current filters.<p>Try a different search term, or clear the active KPI filter above.</p>';
      list.appendChild(empty);
      return;
    }

    // With no filters active, split "Needs Status" papers into a collapsed
    // section by default — they're usually the majority of the list and
    // drown out papers that actually have active work happening.
    var noFiltersActive = !state.activeKpi && !state.search.trim();
    if (!noFiltersActive) {
      papers.forEach(function(p){ list.appendChild(renderPaperCard(p)); });
      return;
    }

    var active = papers.filter(function(p){ return !statusHas(p, "Needs Status"); });
    var needsStatus = papers.filter(function(p){ return statusHas(p, "Needs Status"); });

    active.forEach(function(p){ list.appendChild(renderPaperCard(p)); });

    if (needsStatus.length > 0) {
      var details = document.createElement("details");
      details.className = "needs-status-block";
      details.open = state.needsStatusOpen;
      details.addEventListener("toggle", function(){ state.needsStatusOpen = details.open; });

      var summary = document.createElement("summary");
      summary.textContent = "Needs Status — " + needsStatus.length +
        (needsStatus.length === 1 ? " paper" : " papers") + " with no stage set yet";
      details.appendChild(summary);

      var innerList = document.createElement("div");
      innerList.className = "paper-list needs-status-list";
      needsStatus.forEach(function(p){ innerList.appendChild(renderPaperCard(p)); });
      details.appendChild(innerList);

      list.appendChild(details);
    }
  }

  // Clears every active filter, opens one specific paper's detail panel,
  // and scrolls its card into view — used by the right-rail widgets, whose
  // "Upcoming deadlines" / "Recently added" items are always drawn from
  // the FULL dataset regardless of what's currently filtered, so the
  // paper they point at might not even be in the current filtered view.
  function focusOnPaper(paperId){
    state.activeKpi = null;
    state.search = "";
    state.filterStage = null;
    state.filterStatus = null;
    state.filterOpenOnly = false;
    document.getElementById("search-input").value = "";
    state.openDetailPaperId = paperId;
    render();
    var card = document.querySelector('.paper-card[data-paper-id="' + paperId + '"]');
    if (card) card.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function renderLeftRail(){
    var mount = document.getElementById("filters-rail");
    var stages = STAGE_OPTIONS.slice(1); // drop the "" (no-change) sentinel
    var statuses = Array.from(new Set(state.papers.map(function(p){ return p.status; }).filter(Boolean))).sort();

    function chip(label, count, active, disabled){
      return '<button type="button" class="filter-chip' + (active ? " active" : "") + '"' +
        (disabled ? " disabled" : "") + '>' +
        '<span>' + escapeHtml(label) + '</span><span class="chip-count">' + count + '</span></button>';
    }

    var stageChips = stages.map(function(s){
      var count = state.papers.filter(function(p){ return p.stage === s && matchesFilters(p, { stage: true }); }).length;
      return chip(s, count, state.filterStage === s, count === 0 && state.filterStage !== s);
    }).join("");

    var statusChips = statuses.map(function(s){
      var count = state.papers.filter(function(p){ return p.status === s && matchesFilters(p, { status: true }); }).length;
      return chip(s, count, state.filterStatus === s, count === 0 && state.filterStatus !== s);
    }).join("");

    var openCount = state.papers.filter(function(p){ return p.openToNewMembers && matchesFilters(p, { open: true }); }).length;

    mount.innerHTML =
      '<h6>Filters</h6>' +
      '<div class="filter-group"><span class="filter-group-label">Stage</span>' + stageChips + '</div>' +
      '<div class="filter-group"><span class="filter-group-label">Status</span>' + statusChips + '</div>' +
      '<div class="filter-group"><span class="filter-group-label">Membership</span>' +
        chip("Open to new members", openCount, state.filterOpenOnly, openCount === 0 && !state.filterOpenOnly) +
      '</div>';

    var stageButtons = mount.querySelectorAll(".filter-group")[0].querySelectorAll(".filter-chip");
    stageButtons.forEach(function(btn, i){
      btn.addEventListener("click", function(){
        state.filterStage = (state.filterStage === stages[i]) ? null : stages[i];
        render();
      });
    });
    var statusButtons = mount.querySelectorAll(".filter-group")[1].querySelectorAll(".filter-chip");
    statusButtons.forEach(function(btn, i){
      btn.addEventListener("click", function(){
        state.filterStatus = (state.filterStatus === statuses[i]) ? null : statuses[i];
        render();
      });
    });
    mount.querySelectorAll(".filter-group")[2].querySelector(".filter-chip").addEventListener("click", function(){
      state.filterOpenOnly = !state.filterOpenOnly;
      render();
    });
  }

  function renderRightRail(){
    var mount = document.getElementById("right-rail");

    var withDeadline = state.papers.filter(function(p){ return typeof p.daysLeft === "number"; })
      .sort(function(a, b){ return a.daysLeft - b.daysLeft; })
      .slice(0, 5);
    var deadlinesHtml = withDeadline.length
      ? '<ul class="rail-widget-list">' + withDeadline.map(function(p){
          var overdue = p.daysLeft < 0;
          var metaText = overdue ? Math.abs(p.daysLeft) + "d overdue" : p.daysLeft + "d left";
          return '<li><button type="button" class="rail-widget-item" data-focus-paper="' + escapeHtml(p.id) + '">' +
            '<span class="rw-title">' + escapeHtml(p.title) + '</span>' +
            '<span class="rw-meta' + (overdue ? " overdue" : "") + '">' + metaText + '</span></button></li>';
        }).join("") + '</ul>'
      : '<p class="rail-widget-empty">No deadlines on the books right now.</p>';

    // "Recently updated" needs real lastUpdated data on enough papers to be
    // worth showing (today's real data.json has none — every paper came
    // straight from the spreadsheet with no per-paper edit timestamp yet).
    // Falls back to "Recently added via demo mode" so the widget isn't
    // just empty during a demo — see README.md's "Dashboard layout" notes.
    var withLastUpdated = state.papers.filter(function(p){ return p.lastUpdated; });
    var secondWidgetTitle, secondWidgetHtml;
    if (withLastUpdated.length >= 3) {
      var recent = withLastUpdated.slice().sort(function(a, b){ return (b.lastUpdated || "").localeCompare(a.lastUpdated || ""); }).slice(0, 5);
      secondWidgetTitle = "Recently updated";
      secondWidgetHtml = '<ul class="rail-widget-list">' + recent.map(function(p){
        return '<li><button type="button" class="rail-widget-item" data-focus-paper="' + escapeHtml(p.id) + '">' +
          '<span class="rw-title">' + escapeHtml(p.title) + '</span>' +
          '<span class="rw-meta">' + escapeHtml(fmtDate(p.lastUpdated)) + '</span></button></li>';
      }).join("") + '</ul>';
    } else {
      var demoAdded = state.papers.filter(function(p){ return p._demoAdded; })
        .sort(function(a, b){ return (b._demoCreatedAt || "").localeCompare(a._demoCreatedAt || ""); })
        .slice(0, 5);
      secondWidgetTitle = "Recently added via demo mode";
      secondWidgetHtml = demoAdded.length
        ? '<ul class="rail-widget-list">' + demoAdded.map(function(p){
            return '<li><button type="button" class="rail-widget-item" data-focus-paper="' + escapeHtml(p.id) + '">' +
              '<span class="rw-title">' + escapeHtml(p.title) + '</span>' +
              '<span class="rw-meta">by ' + escapeHtml(p._demoCreatedBy || "someone") + '</span></button></li>';
          }).join("") + '</ul>'
        : '<p class="rail-widget-empty">No demo activity yet — try "+ New Project".</p>';
    }

    mount.innerHTML =
      '<div class="rail-section"><h6>Upcoming deadlines</h6>' + deadlinesHtml + '</div>' +
      '<div class="rail-section"><h6>' + escapeHtml(secondWidgetTitle) + '</h6>' + secondWidgetHtml + '</div>';

    mount.querySelectorAll("[data-focus-paper]").forEach(function(btn){
      btn.addEventListener("click", function(){ focusOnPaper(btn.getAttribute("data-focus-paper")); });
    });
  }

  function render(){
    if (state.loading) {
      renderKpiSkeleton();
      renderListSkeleton();
      return;
    }
    renderKpis();
    renderList();
    renderLeftRail();
    renderRightRail();
  }

  function wireControls(){
    document.getElementById("search-input").addEventListener("input", function(e){
      state.search = e.target.value;
      render();
    });
  }

  function wirePrintExpansion(){
    // The "Needs Status" section is a native <details> element, and
    // browsers hide its content whenever it's closed — a plain CSS print
    // override isn't reliable against that, so toggle the real `open`
    // attribute around the print event instead. (Submission-history
    // timelines are plain divs and are force-shown via @media print CSS.)
    window.addEventListener("beforeprint", function(){
      document.querySelectorAll("details.needs-status-block").forEach(function(d){
        d.dataset.wasOpen = d.open ? "1" : "0";
        d.open = true;
      });
    });
    window.addEventListener("afterprint", function(){
      document.querySelectorAll("details.needs-status-block").forEach(function(d){
        d.open = d.dataset.wasOpen === "1";
      });
    });
  }

  function dataUrl(){
    var params = new URLSearchParams(window.location.search);
    return params.get("data") || "data.json";
  }

  function wireDemoBanner(){
    var banner = document.getElementById("demo-banner");
    try {
      if (sessionStorage.getItem(DEMO_BANNER_DISMISSED_KEY) === "1") {
        banner.classList.add("dismissed");
      }
    } catch (e) { /* non-fatal */ }

    document.getElementById("dismiss-demo-btn").addEventListener("click", function(){
      banner.classList.add("dismissed");
      try { sessionStorage.setItem(DEMO_BANNER_DISMISSED_KEY, "1"); } catch (e) { /* non-fatal */ }
    });

    document.getElementById("reset-demo-btn").addEventListener("click", function(){
      showConfirmModal({
        title: "Reset demo data?",
        message: "This clears all local demo edits (including any added or deleted projects) and reloads the original data.",
        confirmLabel: "Reset demo data"
      }, function(){
        localStorage.removeItem(DEMO_EDITS_KEY);
        localStorage.removeItem(DEMO_ADDED_KEY);
        localStorage.removeItem(DEMO_DELETED_KEY);
        state.openDetailPaperId = null;
        showToast("Demo data reset — reloading…", "success");
        setTimeout(function(){ location.reload(); }, 500);
      });
    });

    var overlay = document.getElementById("copy-json-overlay");
    var textarea = document.getElementById("copy-json-text");
    var copyBtn = document.getElementById("copy-json-copy");

    document.getElementById("copy-demo-btn").addEventListener("click", function(){
      var dump = {
        edits: loadDemoEdits(),
        added: loadDemoAdded(),
        deleted: loadDemoDeleted()
      };
      textarea.value = JSON.stringify(dump, null, 2);
      copyBtn.textContent = "Copy to clipboard";
      overlay.classList.add("open");
      textarea.focus();
      textarea.select();
    });

    document.getElementById("copy-json-close").addEventListener("click", function(){
      overlay.classList.remove("open");
    });

    copyBtn.addEventListener("click", function(){
      textarea.select();
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(function(){
          copyBtn.textContent = "Copied!";
        }).catch(function(){
          copyBtn.textContent = "Select all + Ctrl/Cmd-C";
        });
      } else {
        copyBtn.textContent = "Select all + Ctrl/Cmd-C";
      }
    });
  }

  // -------------------- New Project --------------------

  function closeNewProjectModal(){
    document.getElementById("new-project-overlay").classList.remove("open");
  }

  function renderNewProjectForm(){
    var uid = "new-project";
    var slot = document.getElementById("new-project-form-slot");
    var storedName = getDemoName();
    var blank = {};

    slot.innerHTML =
      '<p class="hint">This is saved to your browser only — see the demo-mode banner. If "Open to new members" is checked below, it will also show up on the <a href="discover.html" target="_blank" rel="noopener">Discover page</a>, flagged as a demo addition — but only in this browser. It\'s not a real publish: other visitors reading the real, published data never see it until this goes through the real spreadsheet.</p>' +
      '<div class="edit-message-slot"></div>' +
      '<div class="edit-field">' +
        '<label for="' + uid + '-title">Title *</label>' +
        '<input type="text" id="' + uid + '-title" placeholder="Paper / project title">' +
      '</div>' +
      '<div class="edit-field">' +
        '<label for="' + uid + '-name">Your name<span class="field-hint">Shown as the creator — demo attribution only, not verified.</span></label>' +
        '<input type="text" id="' + uid + '-name" placeholder="e.g. Jane Doe" value="' + escapeHtml(storedName) + '">' +
      '</div>' +
      renderCommonProjectFieldsHtml(uid, blank) +
      '<div class="modal-actions">' +
        '<button type="button" class="edit-btn-secondary" id="new-project-cancel">Cancel</button>' +
        '<button type="button" class="edit-btn-primary" id="new-project-save">Create project</button>' +
      '</div>';

    var fieldContainers = wireCommonProjectFieldsInteractivity(slot, uid, blank);
    var msgSlot = slot.querySelector(".edit-message-slot");

    document.getElementById("new-project-cancel").addEventListener("click", closeNewProjectModal);

    document.getElementById("new-project-save").addEventListener("click", function(){
      var title = slot.querySelector("#" + uid + "-title").value.trim();
      var name = slot.querySelector("#" + uid + "-name").value.trim();
      if (!title) {
        showEditMessage(msgSlot, "error", "Title is required.");
        return;
      }
      if (!name) {
        showEditMessage(msgSlot, "error", "Enter your name so this is attributed correctly.");
        return;
      }
      setDemoName(name);

      var v = readCommonProjectFieldValues(slot, uid, fieldContainers);
      var now = new Date();
      var status = deriveStatus(v.stage || null, 0, null, v.deadline || null, null, now);
      var id = nextPaperId();

      var paper = {
        id: id,
        title: title,
        stage: v.stage || null,
        status: status,
        priority: v.priority || null,
        targetVenue: v.targetVenue || null,
        targetDeadline: v.targetDeadline || null,
        attempts: 0,
        currentVenue: null,
        deadline: v.deadline || null,
        daysLeft: v.deadline ? daysLeftFromDeadline(v.deadline, now) : null,
        latestDecision: null,
        owner: v.owner || null,
        authors: null,
        finalFile: null,
        publishedDate: null,
        progressPct: null,
        lastUpdated: now.toISOString().slice(0, 10),
        githubRepo: null,
        notes: null,
        submissions: [],
        nextMeeting: (v.meetDate || v.meetLink) ? { date: v.meetDate || null, link: v.meetLink || null } : null,
        pastMeetings: [],
        currentDraftLink: v.draftLink || null,
        resources: v.resources,
        abstract: v.abstract || null,
        tags: v.tags,
        skillsNeeded: v.skillsNeeded,
        openToNewMembers: v.openToNewMembers,
        whatsapp: v.whatsapp || null,
        teamMembers: v.teamMembers
      };

      commitDemoAdd(paper, name);
      closeNewProjectModal();
      state.openDetailPaperId = id;
      showToast("Project created — saved to this browser only.", "success");
      refreshFromDemoEdits();
    });
  }

  function wireNewProjectModal(){
    document.getElementById("new-project-btn").addEventListener("click", function(){
      renderNewProjectForm();
      document.getElementById("new-project-overlay").classList.add("open");
    });
  }

  function wireFiltersToggle(){
    var toggleBtn = document.getElementById("filters-toggle");
    var content = document.getElementById("filters-rail-content");
    toggleBtn.addEventListener("click", function(){
      var open = content.classList.toggle("open");
      toggleBtn.setAttribute("aria-expanded", open ? "true" : "false");
    });
  }

  function init(){
    wireControls();
    wirePrintExpansion();
    wireDemoBanner();
    wireNewProjectModal();
    wireFiltersToggle();
    render();
    fetch(dataUrl())
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + dataUrl());
        return res.json();
      })
      .then(function(data){
        state.rawPapers = Array.isArray(data.papers) ? data.papers : [];
        state.papers = buildMergedPapers(state.rawPapers);
        state.loading = false;
        render();
      })
      .catch(function(err){
        console.error("Lab Ledger: failed to load data.", err);
        showError("Couldn't load " + dataUrl() + " — check the console. (This page must be served over http://, not opened as a file:// URL — see README.)");
        state.rawPapers = [];
        state.papers = [];
        state.loading = false;
        render();
      });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
