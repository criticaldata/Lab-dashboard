<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab Ledger — MIT Critical Data</title>
<link rel="icon" href="assets/favicon.ico">
<style>
  :root{
    --mit-red:#A31F34;
    --mit-charcoal:#333333;
    --ink:#1c1c1c;
    --muted:#6b6b6b;
    --line:#e3e1de;
    --bg:#ffffff;
    --panel:#faf9f7;
    --teal:#0f7a7a;
    --teal-bg:#e3f4f4;
    --green:#1e7d3c;
    --green-bg:#e4f5e9;
    --amber:#8a6100;
    --amber-bg:#fbf0d6;
    --orange:#a15c00;
    --orange-bg:#fbe9d6;
    --red:#A31F34;
    --red-bg:#fbe4e8;
    --gray:#595959;
    --gray-bg:#eeece9;
    --focus:#2563eb;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    line-height:1.4;
  }
  a{color:var(--mit-red);}
  button{font:inherit;}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px 64px;}

  header.site{
    border-bottom:3px solid var(--mit-red);
    padding:20px 0;
    margin-bottom:28px;
  }
  header.site .wrap{
    display:flex;
    align-items:center;
    gap:16px;
    flex-wrap:wrap;
  }
  header.site img.logo{height:40px;width:auto;display:block;}
  header.site h1{
    font-size:1.35rem;
    margin:0;
    color:var(--mit-charcoal);
    font-weight:700;
  }
  header.site p.tagline{
    margin:2px 0 0;
    color:var(--muted);
    font-size:.85rem;
  }

  #error-banner{
    display:none;
    max-width:1100px;
    margin:0 auto 20px;
    padding:14px 18px;
    background:var(--red-bg);
    border:1px solid var(--mit-red);
    color:var(--mit-charcoal);
    border-radius:6px;
    font-size:.92rem;
  }
  #error-banner code{background:rgba(0,0,0,.06);padding:1px 5px;border-radius:3px;}

  .kpi-row{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    margin-bottom:26px;
  }
  .kpi-card{
    text-align:left;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 14px;
    cursor:pointer;
    transition:border-color .12s,box-shadow .12s;
  }
  .kpi-card:hover{border-color:var(--mit-red);}
  .kpi-card:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
  .kpi-card.active{
    border-color:var(--mit-red);
    box-shadow:0 0 0 1px var(--mit-red);
    background:#fff;
  }
  .kpi-card .num{font-size:1.6rem;font-weight:700;color:var(--mit-charcoal);}
  .kpi-card.active .num{color:var(--mit-red);}
  .kpi-card .label{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px;}

  .controls{
    display:flex;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .controls input[type=search],
  .controls select{
    padding:9px 12px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.9rem;
    background:#fff;
    color:var(--ink);
  }
  .controls input[type=search]{flex:1 1 260px;min-width:200px;}
  .controls select{flex:0 0 auto;min-width:160px;}
  .controls input[type=search]:focus,
  .controls select:focus{outline:2px solid var(--focus);outline-offset:1px;}

  #result-count{
    font-size:.82rem;
    color:var(--muted);
    margin-bottom:12px;
  }

  .paper-list{display:flex;flex-direction:column;gap:8px;}
  .paper-card{
    border:1px solid var(--line);
    border-radius:8px;
    padding:12px 16px;
    background:#fff;
  }

  .needs-status-block{
    margin-top:2px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
  }
  .needs-status-block summary{
    cursor:pointer;
    padding:12px 16px;
    font-weight:600;
    font-size:.88rem;
    color:var(--mit-charcoal);
  }
  .needs-status-block summary:focus-visible{outline:2px solid var(--focus);outline-offset:-2px;}
  .needs-status-block[open] summary{border-bottom:1px solid var(--line);}
  .needs-status-list{padding:10px;}
  .paper-card .row1{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    flex-wrap:wrap;
  }
  .paper-card h3{
    margin:0;
    font-size:1rem;
    font-weight:600;
    color:var(--mit-charcoal);
    max-width:70ch;
  }
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    padding:3px 10px;
    border-radius:999px;
    font-size:.76rem;
    font-weight:600;
    white-space:nowrap;
  }
  .badge.b-teal{color:var(--teal);background:var(--teal-bg);}
  .badge.b-green{color:var(--green);background:var(--green-bg);}
  .badge.b-amber{color:var(--amber);background:var(--amber-bg);}
  .badge.b-orange{color:var(--orange);background:var(--orange-bg);}
  .badge.b-red{color:var(--red);background:var(--red-bg);}
  .badge.b-gray{color:var(--gray);background:var(--gray-bg);}

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:6px 16px;
    margin-top:8px;
    font-size:.82rem;
    color:var(--muted);
  }
  .meta-row .meta-item strong{color:var(--ink);font-weight:600;}
  .priority-High{color:var(--mit-red);font-weight:600;}

  .card-actions{
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:10px;
  }
  .history-toggle,
  .edit-toggle{
    background:none;
    border:none;
    color:var(--mit-red);
    font-size:.82rem;
    font-weight:600;
    cursor:pointer;
    padding:4px 0;
  }
  .history-toggle{margin-top:0;}
  .history-toggle:hover,
  .edit-toggle:hover{text-decoration:underline;}
  .history-toggle:focus-visible,
  .edit-toggle:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}

  .edit-panel{
    display:none;
    margin-top:12px;
    padding:14px 16px;
    border:1px solid var(--line);
    border-radius:8px;
    background:var(--panel);
  }
  .edit-panel.open{display:block;}
  .edit-panel h4{
    margin:0 0 10px;
    font-size:.82rem;
    font-weight:700;
    color:var(--mit-charcoal);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .edit-panel p.hint{
    margin:0 0 12px;
    font-size:.82rem;
    color:var(--muted);
  }
  .edit-field{margin-bottom:10px;}
  .edit-field label{
    display:block;
    font-size:.78rem;
    font-weight:600;
    color:var(--ink);
    margin-bottom:4px;
  }
  .edit-field .field-hint{
    display:block;
    font-size:.74rem;
    font-weight:400;
    color:var(--muted);
    margin-top:2px;
  }
  .edit-field input[type=text],
  .edit-field input[type=date],
  .edit-field input[type=email],
  .edit-field select,
  .edit-field textarea{
    width:100%;
    padding:8px 10px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:.88rem;
    font-family:inherit;
    background:#fff;
    color:var(--ink);
  }
  .edit-field textarea{resize:vertical;min-height:56px;}
  .edit-field input:focus,
  .edit-field select:focus,
  .edit-field textarea:focus{outline:2px solid var(--focus);outline-offset:1px;}
  .edit-fieldset{
    border:none;
    padding:10px 0 0;
    margin:12px 0 0;
    border-top:1px dashed var(--line);
  }
  .edit-fieldset legend{
    font-size:.78rem;
    font-weight:700;
    color:var(--mit-charcoal);
    padding:0;
    margin-bottom:6px;
  }
  .edit-row2{display:flex;gap:10px;}
  .edit-row2 > .edit-field{flex:1;}
  .edit-actions{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .edit-btn-primary{
    background:var(--mit-red);
    color:#fff;
    border:none;
    border-radius:6px;
    padding:9px 16px;
    font-size:.86rem;
    font-weight:600;
    cursor:pointer;
  }
  .edit-btn-primary:hover{background:#8a1a2b;}
  .edit-btn-primary:disabled{background:var(--gray);cursor:not-allowed;}
  .edit-btn-secondary{
    background:none;
    border:none;
    color:var(--muted);
    font-size:.82rem;
    cursor:pointer;
    text-decoration:underline;
  }
  .edit-message{
    font-size:.82rem;
    padding:8px 12px;
    border-radius:6px;
    margin-bottom:12px;
  }
  .edit-message.info{background:var(--teal-bg);color:var(--teal);}
  .edit-message.error{background:var(--red-bg);color:var(--mit-red);}
  .edit-message.success{background:var(--green-bg);color:var(--green);}
  .code-input{
    font-size:1.3rem !important;
    letter-spacing:.3em;
    text-align:center;
    font-family:ui-monospace,Consolas,monospace;
  }

  .timeline{
    display:none;
    margin-top:12px;
    padding-left:0;
    border-top:1px dashed var(--line);
    padding-top:12px;
  }
  .timeline.open{display:block;}
  .timeline ol{list-style:none;margin:0;padding:0;}
  .timeline li{
    position:relative;
    padding:0 0 14px 20px;
    border-left:2px solid var(--line);
  }
  .timeline li:last-child{border-left-color:transparent;padding-bottom:0;}
  .timeline li::before{
    content:"";
    position:absolute;
    left:-6px;top:2px;
    width:10px;height:10px;
    border-radius:50%;
    background:var(--mit-red);
    border:2px solid #fff;
  }
  .timeline .t-venue{font-weight:600;color:var(--mit-charcoal);font-size:.88rem;}
  .timeline .t-meta{font-size:.78rem;color:var(--muted);margin-top:2px;}
  .timeline .t-notes{font-size:.78rem;color:var(--muted);margin-top:3px;font-style:italic;}

  .empty-state{
    text-align:center;
    padding:48px 20px;
    color:var(--muted);
  }

  footer.site{
    margin-top:40px;
    padding-top:16px;
    border-top:1px solid var(--line);
    font-size:.78rem;
    color:var(--muted);
  }

  @media (max-width:820px){
    .kpi-row{grid-template-columns:repeat(3,1fr);}
  }
  @media (max-width:520px){
    .kpi-row{grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:18px;}
    .kpi-card{padding:10px 12px;}
    header.site img.logo{height:32px;}
    header.site h1{font-size:1.1rem;}
    .paper-card{padding:10px 14px;}
    .paper-card h3{max-width:100%;}
    .controls select{flex:1 1 100%;}
  }

  @media print{
    *{
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
      color-adjust:exact;
    }
    body{font-size:11pt;}
    .controls,
    #result-count,
    .history-toggle,
    .edit-toggle,
    .edit-panel,
    .empty-state{display:none !important;}
    header.site{margin-bottom:16px;padding:10px 0;}
    .kpi-row{margin-bottom:16px;}
    .kpi-card{break-inside:avoid;box-shadow:none;}
    .kpi-card:hover{border-color:var(--line);}
    .paper-list{gap:6px;}
    .paper-card{
      break-inside:avoid;
      page-break-inside:avoid;
      padding:10px 14px;
    }
    .needs-status-block{break-inside:auto;border:none;background:none;}
    .needs-status-block summary{
      padding:8px 0;
      border-bottom:1px solid var(--line);
      margin-bottom:8px;
    }
    .timeline{display:block !important;border-top:1px dashed var(--line);}
    a{color:inherit;text-decoration:none;}
  }
</style>
</head>
<body>

<header class="site">
  <div class="wrap">
    <img class="logo" src="assets/mit-critical-data-logo.svg" alt="MIT Critical Data">
    <div>
      <h1>Lab Ledger</h1>
      <p class="tagline">Every paper, what stage it's at, and its full submission history.</p>
    </div>
  </div>
</header>

<div id="error-banner" role="alert"></div>

<main class="wrap">
  <div class="kpi-row" id="kpi-row"></div>

  <div class="controls">
    <input type="search" id="search-input" placeholder="Search title, author, venue, notes…" aria-label="Search papers">
    <select id="owner-select" aria-label="Filter by owner">
      <option value="">All owners</option>
    </select>
  </div>

  <div id="result-count"></div>
  <div class="paper-list" id="paper-list"></div>
</main>

<div class="wrap"><footer class="site">Lab Ledger — MIT Critical Data. Data regenerated from <code>Lab_Papers_Dashboard.xlsx</code> via <code>export_data.py</code>.</footer></div>

<script>
(function(){
  "use strict";

  var state = {
    papers: [],
    activeKpi: null,
    search: "",
    owner: "",
    needsStatusOpen: false
  };

  var KPI_DEFS = [
    { key: "total",        label: "Total Papers",          test: function(){ return true; } },
    { key: "preSub",       label: "Pre-Submission",         test: function(p){ return p.attempts === 0; } },
    { key: "outForReview", label: "Currently Out for Review", test: function(p){ return p.attempts > 0 && !isAcceptedOrPublished(p); } },
    { key: "accepted",     label: "Accepted / Published",   test: isAcceptedOrPublished },
    { key: "overdue",      label: "Overdue",                test: function(p){ return statusHas(p, "Overdue"); } },
    { key: "needsStatus",  label: "Needs Status",           test: function(p){ return statusHas(p, "Needs Status"); } }
  ];

  function statusHas(p, needle){
    return !!(p.status && p.status.indexOf(needle) !== -1);
  }
  function isAcceptedOrPublished(p){
    return statusHas(p, "Completed") || statusHas(p, "Published");
  }

  function badgeClass(status){
    if (!status) return "b-gray";
    if (status.indexOf("Overdue") !== -1 || status.indexOf("Closed") !== -1) return "b-red";
    if (status.indexOf("Needs Attention") !== -1) return "b-amber";
    if (status.indexOf("Waiting") !== -1) return "b-orange";
    if (status.indexOf("Reviewing") !== -1) return "b-teal";
    if (status.indexOf("On Track") !== -1) return "b-green";
    if (status.indexOf("Completed") !== -1 || status.indexOf("Published") !== -1) return "b-green";
    return "b-gray";
  }

  function fmtDate(iso){
    if (!iso) return null;
    var d = new Date(iso + (iso.length <= 10 ? "T00:00:00" : ""));
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function showError(message){
    var el = document.getElementById("error-banner");
    el.textContent = message;
    el.style.display = "block";
  }

  function renderKpis(){
    var row = document.getElementById("kpi-row");
    row.innerHTML = "";
    KPI_DEFS.forEach(function(def){
      var count = state.papers.filter(def.test).length;
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "kpi-card" + (state.activeKpi === def.key ? " active" : "");
      btn.setAttribute("aria-pressed", state.activeKpi === def.key ? "true" : "false");
      btn.innerHTML = '<div class="num">' + count + '</div><div class="label">' + escapeHtml(def.label) + '</div>';
      btn.addEventListener("click", function(){
        state.activeKpi = (state.activeKpi === def.key) ? null : def.key;
        render();
      });
      row.appendChild(btn);
    });
  }

  function populateOwnerSelect(){
    var sel = document.getElementById("owner-select");
    var current = sel.value;
    var owners = Array.from(new Set(state.papers.map(function(p){ return p.owner; }).filter(Boolean))).sort();
    sel.innerHTML = '<option value="">All owners</option>' +
      owners.map(function(o){ return '<option value="' + escapeHtml(o) + '">' + escapeHtml(o) + '</option>'; }).join("");
    sel.value = current;
  }

  function matchesSearch(p, q){
    if (!q) return true;
    var haystack = [p.title, p.authors, p.owner, p.currentVenue, p.targetVenue, p.notes]
      .filter(Boolean).join(" ").toLowerCase();
    return haystack.indexOf(q) !== -1;
  }

  function filteredPapers(){
    var kpiDef = KPI_DEFS.find(function(d){ return d.key === state.activeKpi; });
    var q = state.search.trim().toLowerCase();
    return state.papers.filter(function(p){
      if (kpiDef && !kpiDef.test(p)) return false;
      if (state.owner && p.owner !== state.owner) return false;
      if (!matchesSearch(p, q)) return false;
      return true;
    });
  }

  function renderHistoryToggle(p){
    if (!p.submissions || p.submissions.length === 0) return "";
    return '<button type="button" class="history-toggle" data-history-toggle>Submission history (' + p.submissions.length + ')</button>';
  }

  function renderTimelineContent(p){
    if (!p.submissions || p.submissions.length === 0) return "";
    var items = p.submissions.map(function(s){
      var venue = escapeHtml(s.venue || "Unknown venue");
      var parts = [];
      if (s.submittedDate) parts.push("Submitted " + fmtDate(s.submittedDate));
      if (s.decision) parts.push(escapeHtml(s.decision) + (s.decisionDate ? " " + fmtDate(s.decisionDate) : ""));
      var notes = s.notes ? '<div class="t-notes">' + escapeHtml(s.notes) + '</div>' : "";
      return '<li><div class="t-venue">Attempt ' + (s.attempt != null ? s.attempt : "?") + " — " + venue + '</div>' +
             '<div class="t-meta">' + parts.join(" · ") + '</div>' + notes + '</li>';
    }).join("");
    return '<div class="timeline"><ol>' + items + '</ol></div>';
  }

  // ---------------------------------------------------------------------
  // Inline edit flow: email -> one-time code -> edit fields -> save.
  //
  // The dashboard's core data load (init(), above/below) never depends on
  // any of this — WORKER_URL is only ever contacted when a user actively
  // opens an edit panel, so a misconfigured or unreachable Worker can never
  // break the read-only page loading data.json.
  // ---------------------------------------------------------------------

  // Set this to your deployed Worker's URL once you've run `wrangler
  // deploy` — see README.md's "Worker setup" section. Left as a placeholder
  // here, editing shows a friendly "unavailable" message instead of trying
  // (and failing) to reach a real endpoint.
  var WORKER_URL = "https://lab-ledger-updates.YOUR-SUBDOMAIN.workers.dev";
  var SESSION_KEY = "labledger_session";

  // ?worker=<url> overrides WORKER_URL, mirroring the existing ?data=
  // override — handy for pointing at a staging Worker (or a mocked one in
  // tests) without editing this file.
  function getWorkerUrl(){
    var params = new URLSearchParams(window.location.search);
    return params.get("worker") || WORKER_URL;
  }

  function workerConfigured(){
    return getWorkerUrl().indexOf("YOUR-SUBDOMAIN") === -1;
  }

  function getSession(){
    try {
      var raw = sessionStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      var session = JSON.parse(raw);
      if (!session.token || !session.expiresAt || Date.now() >= session.expiresAt) {
        sessionStorage.removeItem(SESSION_KEY);
        return null;
      }
      return session;
    } catch (e) {
      return null;
    }
  }

  function setSession(email, token, expiresInSeconds){
    var session = { email: email, token: token, expiresAt: Date.now() + expiresInSeconds * 1000 };
    // sessionStorage, not localStorage — the session clears when the tab
    // closes rather than persisting indefinitely on a shared/public computer.
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(session));
    return session;
  }

  function clearSession(){
    sessionStorage.removeItem(SESSION_KEY);
  }

  function workerFetch(path, body){
    if (!workerConfigured()) {
      return Promise.resolve({ ok: false, networkError: true, data: { error: "Editing isn't configured on this deployment yet." } });
    }
    return fetch(getWorkerUrl() + path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function(res){
      return res.json().catch(function(){ return {}; }).then(function(data){
        return { ok: res.ok, status: res.status, data: data };
      });
    }).catch(function(err){
      console.error("Lab Ledger: edit request failed", err);
      return { ok: false, networkError: true, data: { error: "Couldn't reach the update service." } };
    });
  }

  function showEditMessage(slot, type, text){
    slot.innerHTML = '<div class="edit-message ' + type + '">' + escapeHtml(text) + '</div>';
  }

  function closeEditPanel(panel){
    panel.classList.remove("open");
    var card = panel.closest(".paper-card");
    if (card) {
      var toggle = card.querySelector("[data-edit-toggle]");
      if (toggle) toggle.setAttribute("aria-expanded", "false");
    }
  }

  function reloadDataAndRerender(){
    fetch(dataUrl()).then(function(res){ return res.json(); }).then(function(data){
      state.papers = Array.isArray(data.papers) ? data.papers : [];
      populateOwnerSelect();
      render();
    }).catch(function(err){
      console.error("Lab Ledger: failed to refresh after edit", err);
    });
  }

  function renderEditPanel(panel, p){
    var session = getSession();
    if (session) {
      renderFieldsStep(panel, p, session);
    } else {
      renderEmailStep(panel, p);
    }
  }

  function renderEmailStep(panel, p){
    var uid = "edit-" + p.id;
    panel.innerHTML =
      '<h4>Verify your lab email to edit</h4>' +
      '<p class="hint">We’ll email a 6-digit code to confirm you’re a lab member. You won’t need to do this again for a couple of hours.</p>' +
      '<div class="edit-message-slot"></div>' +
      '<div class="edit-field">' +
        '<label for="' + uid + '-email">Lab email</label>' +
        '<input type="email" id="' + uid + '-email" placeholder="you@yourlab.org" autocomplete="email">' +
      '</div>' +
      '<div class="edit-actions">' +
        '<button type="button" class="edit-btn-primary" data-send-code>Send code</button>' +
        '<button type="button" class="edit-btn-secondary" data-cancel-edit>Cancel</button>' +
      '</div>';

    var emailInput = panel.querySelector("#" + uid + "-email");
    var msgSlot = panel.querySelector(".edit-message-slot");
    var sendBtn = panel.querySelector("[data-send-code]");

    emailInput.addEventListener("keydown", function(e){ if (e.key === "Enter") sendBtn.click(); });

    sendBtn.addEventListener("click", function(){
      var email = emailInput.value.trim();
      if (!email || email.indexOf("@") === -1) {
        showEditMessage(msgSlot, "error", "Enter a valid email address.");
        return;
      }
      sendBtn.disabled = true;
      sendBtn.textContent = "Sending…";
      workerFetch("/request-code", { email: email }).then(function(result){
        sendBtn.disabled = false;
        sendBtn.textContent = "Send code";
        if (result.networkError) {
          showEditMessage(msgSlot, "error", "Editing is temporarily unavailable. Please try again later.");
          return;
        }
        renderCodeStep(panel, p, email);
      });
    });

    panel.querySelector("[data-cancel-edit]").addEventListener("click", function(){ closeEditPanel(panel); });
  }

  function renderCodeStep(panel, p, email){
    var uid = "edit-" + p.id;
    panel.innerHTML =
      '<h4>Enter your code</h4>' +
      '<p class="hint">Sent to <strong>' + escapeHtml(email) + '</strong> — expires in 10 minutes.</p>' +
      '<div class="edit-message-slot"></div>' +
      '<div class="edit-field">' +
        '<label for="' + uid + '-code">Verification code</label>' +
        '<input type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" class="code-input" id="' + uid + '-code" placeholder="000000" autocomplete="one-time-code">' +
      '</div>' +
      '<div class="edit-actions">' +
        '<button type="button" class="edit-btn-primary" data-verify-code>Verify</button>' +
        '<button type="button" class="edit-btn-secondary" data-use-different-email>Use a different email</button>' +
      '</div>';

    var codeInput = panel.querySelector("#" + uid + "-code");
    var msgSlot = panel.querySelector(".edit-message-slot");
    var verifyBtn = panel.querySelector("[data-verify-code]");
    codeInput.focus();
    codeInput.addEventListener("keydown", function(e){ if (e.key === "Enter") verifyBtn.click(); });

    verifyBtn.addEventListener("click", function(){
      var code = codeInput.value.trim();
      if (!/^\d{6}$/.test(code)) {
        showEditMessage(msgSlot, "error", "Enter the 6-digit code from your email.");
        return;
      }
      verifyBtn.disabled = true;
      verifyBtn.textContent = "Verifying…";
      workerFetch("/verify-code", { email: email, code: code }).then(function(result){
        verifyBtn.disabled = false;
        verifyBtn.textContent = "Verify";
        if (result.networkError) {
          showEditMessage(msgSlot, "error", "Editing is temporarily unavailable. Please try again later.");
          return;
        }
        if (!result.ok) {
          showEditMessage(msgSlot, "error", (result.data && result.data.error) || "That code didn't work. Please try again.");
          return;
        }
        var session = setSession(email, result.data.token, result.data.expiresIn);
        renderFieldsStep(panel, p, session);
      });
    });

    panel.querySelector("[data-use-different-email]").addEventListener("click", function(){
      renderEmailStep(panel, p);
    });
  }

  function renderFieldsStep(panel, p, session){
    var uid = "edit-" + p.id;
    var owners = Array.from(new Set(state.papers.map(function(x){ return x.owner; }).filter(Boolean))).sort();
    var stageOptions = ["", "Idea", "Drafting", "Internal Review", "On Hold"];
    var priorityOptions = ["", "High", "Medium", "Low"];
    var decisionOptions = ["", "Under Review", "Revise & Resubmit", "Accepted", "Rejected", "Withdrawn"];

    function optionsHtml(values, current, emptyLabel){
      return values.map(function(v){
        var label = v === "" ? emptyLabel : v;
        var selected = v === (current || "") ? " selected" : "";
        return '<option value="' + escapeHtml(v) + '"' + selected + '>' + escapeHtml(label) + '</option>';
      }).join("");
    }

    panel.innerHTML =
      '<h4>Edit ' + escapeHtml(p.id) + '</h4>' +
      '<p class="hint">Signed in as ' + escapeHtml(session.email) + '. <button type="button" class="edit-btn-secondary" data-sign-out>Not you?</button></p>' +
      '<div class="edit-message-slot"></div>' +
      '<div class="edit-field">' +
        '<label for="' + uid + '-stage">Stage</label>' +
        '<select id="' + uid + '-stage">' + optionsHtml(stageOptions, p.stage, "(no change)") + '</select>' +
      '</div>' +
      '<div class="edit-row2">' +
        '<div class="edit-field">' +
          '<label for="' + uid + '-priority">Priority</label>' +
          '<select id="' + uid + '-priority">' + optionsHtml(priorityOptions, p.priority, "(no change)") + '</select>' +
        '</div>' +
        '<div class="edit-field">' +
          '<label for="' + uid + '-owner">Owner</label>' +
          '<select id="' + uid + '-owner">' + optionsHtml([""].concat(owners), p.owner, "(no change)") + '</select>' +
        '</div>' +
      '</div>' +
      '<fieldset class="edit-fieldset">' +
        '<legend>Log a new submission</legend>' +
        '<div class="edit-field">' +
          '<label for="' + uid + '-venue">Venue<span class="field-hint">Leave blank unless you just sent this to a new journal/conference.</span></label>' +
          '<input type="text" id="' + uid + '-venue" placeholder="e.g. Nature Medicine">' +
        '</div>' +
        '<div class="edit-field">' +
          '<label for="' + uid + '-submitted">Submitted date</label>' +
          '<input type="date" id="' + uid + '-submitted">' +
        '</div>' +
      '</fieldset>' +
      '<fieldset class="edit-fieldset">' +
        '<legend>Decision<span class="field-hint" style="display:block;font-weight:400">Applies to the new submission above, or the current venue if Venue is blank.</span></legend>' +
        '<div class="edit-row2">' +
          '<div class="edit-field">' +
            '<label for="' + uid + '-decision">Decision</label>' +
            '<select id="' + uid + '-decision">' + optionsHtml(decisionOptions, "", "(no change)") + '</select>' +
          '</div>' +
          '<div class="edit-field">' +
            '<label for="' + uid + '-decisiondate">Decision date</label>' +
            '<input type="date" id="' + uid + '-decisiondate">' +
          '</div>' +
        '</div>' +
      '</fieldset>' +
      '<div class="edit-field">' +
        '<label for="' + uid + '-notes">Notes<span class="field-hint">Attached to the submission/decision above, or a general note if neither was filled in.</span></label>' +
        '<textarea id="' + uid + '-notes"></textarea>' +
      '</div>' +
      '<div class="edit-actions">' +
        '<button type="button" class="edit-btn-primary" data-save-edit>Save changes</button>' +
        '<button type="button" class="edit-btn-secondary" data-cancel-edit>Cancel</button>' +
      '</div>';

    var msgSlot = panel.querySelector(".edit-message-slot");
    var saveBtn = panel.querySelector("[data-save-edit]");

    panel.querySelector("[data-sign-out]").addEventListener("click", function(){
      clearSession();
      renderEmailStep(panel, p);
    });
    panel.querySelector("[data-cancel-edit]").addEventListener("click", function(){ closeEditPanel(panel); });

    saveBtn.addEventListener("click", function(){
      var stage = panel.querySelector("#" + uid + "-stage").value;
      var priority = panel.querySelector("#" + uid + "-priority").value;
      var owner = panel.querySelector("#" + uid + "-owner").value;
      var venue = panel.querySelector("#" + uid + "-venue").value.trim();
      var submittedDate = panel.querySelector("#" + uid + "-submitted").value;
      var decision = panel.querySelector("#" + uid + "-decision").value;
      var decisionDate = panel.querySelector("#" + uid + "-decisiondate").value;
      var notes = panel.querySelector("#" + uid + "-notes").value.trim();

      var body = { token: session.token, paperId: p.id };
      if (stage) body.stage = stage;
      if (priority) body.priority = priority;
      if (owner) body.owner = owner;
      if (venue) {
        if (!submittedDate) {
          showEditMessage(msgSlot, "error", "Enter a Submitted date to log this new venue.");
          return;
        }
        body.newSubmission = { venue: venue, submittedDate: submittedDate, decision: decision || null, decisionDate: decisionDate || null, notes: notes || null };
      } else if (decision) {
        body.decisionUpdate = { decision: decision, decisionDate: decisionDate || null, notes: notes || null };
      } else if (notes) {
        body.notes = notes;
      }

      if (!body.stage && !body.priority && !body.owner && !body.newSubmission && !body.decisionUpdate && !body.notes) {
        showEditMessage(msgSlot, "error", "Nothing to save — change at least one field.");
        return;
      }

      saveBtn.disabled = true;
      saveBtn.textContent = "Saving…";
      workerFetch("/apply-update", body).then(function(result){
        if (result.networkError) {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
          showEditMessage(msgSlot, "error", "Editing is temporarily unavailable. Please try again later.");
          return;
        }
        if (!result.ok) {
          saveBtn.disabled = false;
          saveBtn.textContent = "Save changes";
          if (result.status === 401 || result.status === 403) {
            clearSession();
            renderEmailStep(panel, p);
            showEditMessage(panel.querySelector(".edit-message-slot"), "error", (result.data && result.data.error) || "Please verify your email again.");
            return;
          }
          showEditMessage(msgSlot, "error", (result.data && result.data.error) || "Something went wrong. Please try again.");
          return;
        }
        var summary = (result.data.summary || []).join(" · ");
        panel.innerHTML = '<div class="edit-message success">Saved!' + (summary ? " " + escapeHtml(summary) : "") + '</div>';
        setTimeout(reloadDataAndRerender, 1500);
      });
    });
  }

  function renderPaperCard(p){
    var badge = '<span class="badge ' + badgeClass(p.status) + '">' + escapeHtml(p.status || "Unknown") + '</span>';
    var meta = [];
    if (p.owner) meta.push('<span class="meta-item"><strong>Owner:</strong> ' + escapeHtml(p.owner) + '</span>');
    if (p.currentVenue) meta.push('<span class="meta-item"><strong>Venue:</strong> ' + escapeHtml(p.currentVenue) + '</span>');
    else if (p.targetVenue) meta.push('<span class="meta-item"><strong>Target venue:</strong> ' + escapeHtml(p.targetVenue) + '</span>');
    if (p.stage) meta.push('<span class="meta-item"><strong>Stage:</strong> ' + escapeHtml(p.stage) + '</span>');
    if (p.priority) meta.push('<span class="meta-item priority-' + escapeHtml(p.priority) + '"><strong>Priority:</strong> ' + escapeHtml(p.priority) + '</span>');
    if (p.deadline) {
      var dl = "Deadline " + fmtDate(p.deadline);
      if (typeof p.daysLeft === "number") {
        dl += p.daysLeft < 0 ? " (" + Math.abs(p.daysLeft) + " days overdue)" : " (" + p.daysLeft + " days left)";
      }
      meta.push('<span class="meta-item">' + dl + '</span>');
    }
    if (p.lastUpdated) meta.push('<span class="meta-item">Last updated ' + fmtDate(p.lastUpdated) + '</span>');

    var el = document.createElement("div");
    el.className = "paper-card";
    el.innerHTML =
      '<div class="row1"><h3>' + escapeHtml(p.title) + '</h3>' + badge + '</div>' +
      '<div class="meta-row">' + meta.join("") + '</div>' +
      '<div class="card-actions">' + renderHistoryToggle(p) +
        '<button type="button" class="edit-toggle" data-edit-toggle aria-expanded="false">Edit</button></div>' +
      renderTimelineContent(p) +
      '<div class="edit-panel" data-edit-panel></div>';

    var toggle = el.querySelector("[data-history-toggle]");
    if (toggle) {
      toggle.addEventListener("click", function(){
        var panel = el.querySelector(".timeline");
        panel.classList.toggle("open");
      });
    }

    var editToggle = el.querySelector("[data-edit-toggle]");
    var editPanel = el.querySelector("[data-edit-panel]");
    editToggle.addEventListener("click", function(){
      var willOpen = !editPanel.classList.contains("open");
      editToggle.setAttribute("aria-expanded", willOpen ? "true" : "false");
      if (willOpen) {
        renderEditPanel(editPanel, p);
        editPanel.classList.add("open");
      } else {
        editPanel.classList.remove("open");
      }
    });

    return el;
  }

  function renderList(){
    var list = document.getElementById("paper-list");
    var count = document.getElementById("result-count");
    var papers = filteredPapers();
    count.textContent = papers.length + " of " + state.papers.length + " papers";
    list.innerHTML = "";
    if (papers.length === 0) {
      var empty = document.createElement("div");
      empty.className = "empty-state";
      empty.textContent = "No papers match the current filters.";
      list.appendChild(empty);
      return;
    }

    // With no filters active, split "Needs Status" papers into a collapsed
    // section by default — they're usually the majority of the list and
    // drown out papers that actually have active work happening.
    var noFiltersActive = !state.activeKpi && !state.search.trim() && !state.owner;
    if (!noFiltersActive) {
      papers.forEach(function(p){ list.appendChild(renderPaperCard(p)); });
      return;
    }

    var active = papers.filter(function(p){ return !statusHas(p, "Needs Status"); });
    var needsStatus = papers.filter(function(p){ return statusHas(p, "Needs Status"); });

    active.forEach(function(p){ list.appendChild(renderPaperCard(p)); });

    if (needsStatus.length > 0) {
      var details = document.createElement("details");
      details.className = "needs-status-block";
      details.open = state.needsStatusOpen;
      details.addEventListener("toggle", function(){ state.needsStatusOpen = details.open; });

      var summary = document.createElement("summary");
      summary.textContent = "Needs Status — " + needsStatus.length +
        (needsStatus.length === 1 ? " paper" : " papers") + " with no stage set yet";
      details.appendChild(summary);

      var innerList = document.createElement("div");
      innerList.className = "paper-list needs-status-list";
      needsStatus.forEach(function(p){ innerList.appendChild(renderPaperCard(p)); });
      details.appendChild(innerList);

      list.appendChild(details);
    }
  }

  function render(){
    renderKpis();
    renderList();
  }

  function wireControls(){
    document.getElementById("search-input").addEventListener("input", function(e){
      state.search = e.target.value;
      renderList();
    });
    document.getElementById("owner-select").addEventListener("change", function(e){
      state.owner = e.target.value;
      renderList();
    });
  }

  function wirePrintExpansion(){
    // The "Needs Status" section is a native <details> element, and
    // browsers hide its content whenever it's closed — a plain CSS print
    // override isn't reliable against that, so toggle the real `open`
    // attribute around the print event instead. (Submission-history
    // timelines are plain divs and are force-shown via @media print CSS.)
    window.addEventListener("beforeprint", function(){
      document.querySelectorAll("details.needs-status-block").forEach(function(d){
        d.dataset.wasOpen = d.open ? "1" : "0";
        d.open = true;
      });
    });
    window.addEventListener("afterprint", function(){
      document.querySelectorAll("details.needs-status-block").forEach(function(d){
        d.open = d.dataset.wasOpen === "1";
      });
    });
  }

  function dataUrl(){
    var params = new URLSearchParams(window.location.search);
    return params.get("data") || "data.json";
  }

  function init(){
    wireControls();
    wirePrintExpansion();
    fetch(dataUrl())
      .then(function(res){
        if (!res.ok) throw new Error("HTTP " + res.status + " fetching " + dataUrl());
        return res.json();
      })
      .then(function(data){
        state.papers = Array.isArray(data.papers) ? data.papers : [];
        populateOwnerSelect();
        render();
      })
      .catch(function(err){
        console.error("Lab Ledger: failed to load data.", err);
        showError("Couldn't load " + dataUrl() + " — check the console. (This page must be served over http://, not opened as a file:// URL — see README.)");
        state.papers = [];
        populateOwnerSelect();
        render();
      });
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
</body>
</html>
